  var ITER = 200000;

  function b64ToBuf(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function show(msg) {
    document.getElementById('err').textContent = msg;
    var btn = document.getElementById('go');
    btn.disabled = false;
    btn.textContent = '解锁';
  }

  function unlock() {
    var pw = document.getElementById('pw').value;
    if (!pw) { show('请输入密码'); return; }
    var btn = document.getElementById('go');
    btn.disabled = true;
    btn.textContent = '解密中…';

    var enc = new TextEncoder();
    crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (km) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64ToBuf(SALT), iterations: ITER, hash: 'SHA-256' },
          km,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(IV) }, key, b64ToBuf(DATA));
      })
      .then(function (plain) {
        var html = new TextDecoder().decode(plain);
        var iframe = document.createElement('iframe');
        iframe.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;border:0;background:#fff;z-index:9999;';
        iframe.srcdoc = html;
        document.body.replaceChildren(iframe);
      })
      .catch(function () {
        show('密码错误，请重试');
      });
  }

  document.getElementById('go').addEventListener('click', unlock);
  document.getElementById('pw').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') unlock();
  });
  document.getElementById('pw').focus();
})();
</script>
